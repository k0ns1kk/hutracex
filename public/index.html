<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HuTraceX</title><script>(()=>{let theme;try{theme=localStorage.getItem('hutracex-theme')}catch{}if(theme!=='light'&&theme!=='dark')theme=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=theme})()</script><link rel="stylesheet" href="/style.css"></head><body><header><div class="brand">◈ HuTraceX <small>Control multiagente</small></div><div class="header-actions"><div class="local">● Local · Debian</div><button id="themeToggle" class="theme-toggle secondary" type="button" aria-label="Cambiar tema"><span id="themeIcon" aria-hidden="true">☀</span><span id="themeLabel">Claro</span></button></div></header><div class="shell"><aside><h3>PROYECTOS</h3><div id="projects"></div><button id="addProject" class="secondary">+ Agregar repositorio</button><hr><h3>HISTORIAS</h3><div id="hus"></div><button id="addHu" class="secondary">+ Nueva HU</button><div class="aside-note">Claude · Codex · Antigravity<br>Seguimiento persistente y aprobaciones</div></aside><main><div id="main"></div></main></div><dialog id="dialog"><form id="modalForm" method="dialog"><h2 id="modalTitle"></h2><div id="modalFields"></div><div class="actions"><button type="button" id="cancelModal" class="secondary">Cancelar</button><button type="submit">Guardar</button></div></form></dialog><dialog id="browseDialog"><div class="browse-head"><h2>Examinar carpetas</h2><button type="button" id="closeBrowse" class="secondary">Cerrar</button></div><p id="browsePath" class="browse-path">Cargando ruta…</p><div class="folder-search"><label class="sr-only" for="browseSearch">Buscar carpetas en esta ubicación</label><span class="search-icon" aria-hidden="true">⌕</span><input id="browseSearch" type="search" placeholder="Buscar carpetas…" autocomplete="off"><button type="button" id="clearBrowseSearch" class="secondary" aria-label="Limpiar búsqueda" title="Limpiar búsqueda" disabled>×</button></div><p id="browseValidity" class="muted small" aria-live="polite"></p><div id="browseError" class="browse-error" role="alert"></div><div id="browseList" class="browse-list"></div><div class="actions"><button type="button" id="browseUp" class="secondary">↑ Carpeta anterior</button><button type="button" id="chooseFolder" disabled>Seleccionar esta carpeta</button></div></dialog><div id="toast"></div><script src="/app.js"></script></body></html>
